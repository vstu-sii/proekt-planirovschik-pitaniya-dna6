name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  architecture:
    name: Architecture compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run architecture:check

  backend:
    name: Backend lint and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  mobile:
    name: Mobile lint, format and export
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format
      - run: npm run typecheck
      - run: npm run export:android
      - run: npm run export:web

  containers:
    name: Full system smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose -f compose.dev.yml config --quiet
      - run: docker compose -f compose.dev.yml up -d --build --wait
      - name: Generate and persist a meal plan
        run: |
          curl --fail --retry 5 --retry-connrefused http://localhost:8000/health
          curl --fail -X POST http://localhost:8000/api/v1/ai/meal-plans \
            -H 'Content-Type: application/json' \
            -d '{"goal":"поддержание веса","budget":{"amount":3500,"currency":"RUB"},"days":1,"restrictions":[],"excluded_products":["арахис"],"pantry":[],"max_cook_time_min":30}'
          curl --fail http://localhost:9411/traces
      - if: always()
        run: docker compose -f compose.dev.yml down --volumes
