name: meal-planner

x-backend-environment: &backend-environment
  APP_ENV: ${APP_ENV:-development}
  DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://meal_planner:meal_planner@db:5432/meal_planner}
  LLM_BASE_URL: ${LLM_BASE_URL:-http://llm-mock:8080}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
  AI_PROVIDER: ${AI_PROVIDER:-http}
  TRACE_COLLECTOR_URL: ${TRACE_COLLECTOR_URL:-http://tracing:9411}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:8081}
  GIGACHAT_CREDENTIALS: ${GIGACHAT_CREDENTIALS:-}
  GIGACHAT_MODEL: ${GIGACHAT_MODEL:-GigaChat-2}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meal_planner}
      POSTGRES_USER: ${POSTGRES_USER:-meal_planner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meal_planner}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  migrate:
    build:
      context: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: *backend-environment
    volumes:
      - ./backend:/app
    networks:
      - data
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  llm-mock:
    build:
      context: ./stubs/llm
    networks:
      - app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  tracing:
    build:
      context: ./stubs/tracing
    ports:
      - "${TRACE_PORT:-9411}:9411"
    volumes:
      - trace_data:/data
    networks:
      - app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9411/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  backend:
    build:
      context: ./backend
    environment: *backend-environment
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    networks:
      - app
      - data
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      llm-mock:
        condition: service_healthy
      tracing:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  frontend:
    build:
      context: ./mobile
      args:
        EXPO_PUBLIC_API_URL: ${WEB_API_URL:-http://localhost:8000}
    ports:
      - "${WEB_PORT:-8080}:80"
    networks:
      - app
    depends_on:
      backend:
        condition: service_healthy

networks:
  app:
    name: meal-planner-app
  data:
    name: meal-planner-data
    internal: true

volumes:
  postgres_data:
    name: meal-planner-postgres-data
  trace_data:
    name: meal-planner-traces
