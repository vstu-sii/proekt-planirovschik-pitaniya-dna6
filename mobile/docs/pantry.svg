<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <rect width="390" height="844" fill="#f7f5ef"/>
  <g font-family="DejaVu Sans" fill="#172019">
    <text x="24" y="42" fill="#246b45" font-size="12" font-weight="700" letter-spacing="2">ЕДА · ПРОСТО</text>
    <text x="24" y="90" fill="#246b45" font-size="13" font-weight="700">Шаг 2 из 2</text>
    <text x="24" y="134" font-size="30" font-weight="700">Что уже есть дома?</text>
    <text x="24" y="169" fill="#68756b" font-size="14">Учтём запасы, чтобы покупать меньше.</text>
    <rect x="20" y="197" width="350" height="392" rx="22" fill="#fff" stroke="#dce5dd"/>
    <text x="42" y="237" font-size="18" font-weight="700">Ваши продукты</text>
    <g font-size="14"><circle cx="60" cy="282" r="17" fill="#eef5ef"/><text x="60" y="287" fill="#246b45" text-anchor="middle">✓</text><text x="90" y="279" font-weight="700">Гречка</text><text x="90" y="299" fill="#68756b" font-size="12">450 г</text>
    <line x1="42" y1="318" x2="348" y2="318" stroke="#dce5dd"/><circle cx="60" cy="353" r="17" fill="#eef5ef"/><text x="60" y="358" fill="#246b45" text-anchor="middle">✓</text><text x="90" y="350" font-weight="700">Яйца</text><text x="90" y="370" fill="#68756b" font-size="12">6 шт</text>
    <line x1="42" y1="389" x2="348" y2="389" stroke="#dce5dd"/><circle cx="60" cy="424" r="17" fill="#eef5ef"/><text x="60" y="429" fill="#246b45" text-anchor="middle">✓</text><text x="90" y="421" font-weight="700">Фасоль консервированная</text><text x="90" y="441" fill="#68756b" font-size="12">1 банка</text></g>
    <rect x="42" y="478" width="306" height="48" rx="14" fill="#fff" stroke="#246b45" stroke-dasharray="5 4"/><text x="195" y="508" fill="#246b45" font-size="14" font-weight="700" text-anchor="middle">＋ Добавить продукт</text>
    <rect x="20" y="607" width="350" height="76" rx="18" fill="#eef5ef"/><text x="40" y="636" font-size="14" font-weight="700">Ограничения</text><text x="40" y="659" fill="#68756b" font-size="13">Без арахиса · Не люблю сельдерей</text>
    <rect x="20" y="706" width="350" height="56" rx="16" fill="#246b45"/><text x="195" y="741" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">Составить план</text>
    <text x="195" y="790" fill="#68756b" font-size="11" text-anchor="middle">Обычно генерация занимает меньше минуты</text>
